# =============================================================================
# PREFIX
# =============================================================================

# Replace the default Ctrl-b prefix with Alt-m.
set -g prefix M-m
unbind C-b

# Pressing the prefix twice sends the prefix key to the foreground application.
bind M-m send-prefix


# =============================================================================
# INDEXING
# =============================================================================

# Start tmux window numbering at 1 instead of 0.
set -g base-index 1

# Pane numbering intentionally remains at tmux's default (0) for now.


# =============================================================================
# NEOVIM / TMUX NAVIGATION
# =============================================================================

# smart-splits.nvim owns @pane-is-vim for the lifetime of Neovim in this pane.
# Prefixless directional movement stops at the outer edge (no wrapping).
bind-key -n C-h if -F '#{@pane-is-vim}' { send-keys C-h } { if -F '#{pane_at_left}'   '' 'select-pane -L' }
bind-key -n C-j if -F '#{@pane-is-vim}' { send-keys C-j } { if -F '#{pane_at_bottom}' '' 'select-pane -D' }
bind-key -n C-k if -F '#{@pane-is-vim}' { send-keys C-k } { if -F '#{pane_at_top}'    '' 'select-pane -U' }
bind-key -n C-l if -F '#{@pane-is-vim}' { send-keys C-l } { if -F '#{pane_at_right}'  '' 'select-pane -R' }

# Match Neovim's Ctrl-Arrow vocabulary and deliberate resize amount.
bind-key -n C-Left  if -F '#{@pane-is-vim}' 'send-keys C-Left'  'resize-pane -L 3'
bind-key -n C-Down  if -F '#{@pane-is-vim}' 'send-keys C-Down'  'resize-pane -D 3'
bind-key -n C-Up    if -F '#{@pane-is-vim}' 'send-keys C-Up'    'resize-pane -U 3'
bind-key -n C-Right if -F '#{@pane-is-vim}' 'send-keys C-Right' 'resize-pane -R 3'


# =============================================================================
# DEFAULT KEYBINDINGS — REFERENCE
# =============================================================================

# These are common tmux defaults.
# They are documented here for discoverability only and are NOT rebound.
#
# With the configured Alt-m prefix:
#
# Alt-m c        → create a new window
# Alt-m ,        → rename the current window
# Alt-m n        → next window
# Alt-m p        → previous window
# Alt-m 1..9     → select window by number
#
# Alt-m %        → split pane left/right
# Alt-m "        → split pane top/bottom
#
# Alt-m ←        → select pane to the left
# Alt-m ↓        → select pane below
# Alt-m ↑        → select pane above
# Alt-m →        → select pane to the right
#
# Alt-m z        → toggle pane zoom
# Alt-m x        → kill current pane
#
# Alt-m d        → detach current client
#
# Alt-m [        → enter copy mode
# Alt-m ]        → paste most recent buffer
#
# Alt-m ?        → show all current keybindings
#
# Keep these as comments until we deliberately decide to override a default.
